version: '3.8'

services:
  postgresql:
    image: postgres:15
    container_name: postgresql
    environment:
      - POSTGRES_DB=netbox
      - POSTGRES_USER=netbox
      - POSTGRES_PASSWORD=Netbox2024!
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dcim-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    networks:
      - dcim-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  netbox:
    image: netboxcommunity/netbox:latest
    container_name: netbox
    environment:
      - SUPERUSER_NAME=admin
      - SUPERUSER_EMAIL=admin@dcim.local
      - SUPERUSER_PASSWORD=@mineE123
    ports:
      - "8000:8080"
    volumes:
      - ./configuration/configuration.py:/etc/netbox/config/configuration.py:ro
      - ./media:/opt/netbox/netbox/media
      - ./reports:/etc/netbox/reports
      - ./scripts:/etc/netbox/scripts
    networks:
      - dcim-network
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
networks:
  dcim-network:
    driver: bridge

volumes:
  postgres_data:
